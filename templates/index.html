<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>✨ 나의 별자리 운세</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="stars-layer" id="starsLayer"></div>

<div class="page">
    <h1 class="brand-title">✨ 나의 별자리 운세</h1>
    <p class="brand-subtitle">생년월일로 알아보는 나의 운명</p>

    <div class="card">
        <form class="date-form" id="birthForm" action="{{ url_for('result') }}" method="get">
            <select name="month" id="monthSelect" required>
                <option value="" disabled selected>월</option>
                {% for m in range(1, 13) %}
                <option value="{{ m }}">{{ m }}월</option>
                {% endfor %}
            </select>
            <select name="day" id="daySelect" required>
                <option value="" disabled selected>일</option>
                {% for d in range(1, 32) %}
                <option value="{{ d }}">{{ d }}일</option>
                {% endfor %}
            </select>
        </form>
        <button type="submit" form="birthForm" class="btn-primary">내 별자리 알아보기</button>
    </div>

    <div class="zodiac-grid">
        {% for key in zodiac_order %}
        {% set info = zodiac[key] %}
        <div class="zodiac-chip">
            <span class="symbol">{{ info.symbol }}</span>
            <span class="label">{{ info.name }}</span>
        </div>
        {% endfor %}
    </div>
</div>

<script src="{{ url_for('static', filename='js/starfield.js') }}"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
