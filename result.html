<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>별자리 결과 | 나의 별자리 운세</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="result">
<canvas id="shooting-star-canvas"></canvas>
<div id="twinkle-layer"></div>
<div class="page-wrap">

  <a href="index.html" class="back-link">← 처음으로</a>

  <div class="glass-card" style="text-align:center; margin-bottom:20px;">
    <span id="result-symbol" class="result-symbol"></span>
    <h1 id="result-name" class="result-name"></h1>
    <p id="result-date" class="result-date"></p>
    <div style="margin-top:10px; font-size:13px; color:rgba(255,255,255,0.6);">
      원소: <b id="result-element" style="color:#a78bfa;"></b>
      &nbsp;|&nbsp;
      수호행성: <b id="result-planet" style="color:#f472b6;"></b>
    </div>
    <div id="result-traits" class="traits-list" style="justify-content:center; margin-top:12px;"></div>
  </div>

  <div class="glass-card">
    <div class="section-title">📊 나의 별자리 능력치</div>
    <div class="stat-row">
      <span class="stat-label">✨ 매력</span>
      <div class="stat-bar-wrap"><div class="stat-bar" id="stat-bar-charm" style="width:0%"></div></div>
      <span class="stat-value" id="stat-val-charm">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">🍀 행운</span>
      <div class="stat-bar-wrap"><div class="stat-bar" id="stat-bar-lucky" style="width:0%"></div></div>
      <span class="stat-value" id="stat-val-lucky">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">💬 사교성</span>
      <div class="stat-bar-wrap"><div class="stat-bar" id="stat-bar-social" style="width:0%"></div></div>
      <span class="stat-value" id="stat-val-social">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">🎨 창의력</span>
      <div class="stat-bar-wrap"><div class="stat-bar" id="stat-bar-creativity" style="width:0%"></div></div>
      <span class="stat-value" id="stat-val-creativity">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">👑 리더십</span>
      <div class="stat-bar-wrap"><div class="stat-bar" id="stat-bar-leadership" style="width:0%"></div></div>
      <span class="stat-value" id="stat-val-leadership">0</span>
    </div>
  </div>

  <div class="glass-card">
    <div class="section-title">🔮 오늘의 운세</div>
    <div class="fortune-grid">
      <div class="fortune-item">
        <span class="fortune-emoji">💕</span>
        <span class="fortune-label">연애운</span>
        <div class="fortune-stars" id="fortune-love"></div>
      </div>
      <div class="fortune-item">
        <span class="fortune-emoji">💰</span>
        <span class="fortune-label">금전운</span>
        <div class="fortune-stars" id="fortune-money"></div>
      </div>
      <div class="fortune-item">
        <span class="fortune-emoji">💪</span>
        <span class="fortune-label">건강운</span>
        <div class="fortune-stars" id="fortune-health"></div>
      </div>
      <div class="fortune-item">
        <span class="fortune-emoji">💼</span>
        <span class="fortune-label">직업운</span>
        <div class="fortune-stars" id="fortune-work"></div>
      </div>
    </div>
    <p id="fortune-message" style="margin-top:14px; font-size:13px; color:rgba(255,255,255,0.8); line-height:1.6; text-align:center;"></p>
    <div style="margin-top:10px; font-size:12px; color:rgba(255,255,255,0.5); text-align:center;">
      🎨 오늘의 행운 색상: <b id="fortune-lucky-color" style="color:#f472b6;"></b>
      &nbsp;|&nbsp;
      💡 <span id="fortune-lucky-advice"></span>
    </div>
  </div>

  <div class="glass-card">
    <div class="section-title">🌟 나의 수호 아이템</div>
    <div class="info-row">
      <span class="info-label">💎 수호석</span>
      <span class="info-value" id="result-stone"></span>
    </div>
    <div class="info-row">
      <span class="info-label">🎨 수호색</span>
      <span class="info-value" id="result-color"></span>
    </div>
    <div class="info-row">
      <span class="info-label">🦁 수호동물</span>
      <span class="info-value" id="result-animal"></span>
    </div>
    <div class="info-row">
      <span class="info-label">🔢 행운 숫자</span>
      <span class="info-value" id="result-lucky"></span>
    </div>
  </div>

  <div class="glass-card">
    <div class="section-title">💕 나와 잘 맞는 별자리</div>
    <div id="result-compat" style="font-size:14px; color:rgba(255,255,255,0.8); line-height:2;"></div>
  </div>

  <div class="coupang-banner">
    <div class="coupang-title">🛍️ 오늘의 행운 아이템</div>
    <div class="coupang-subtitle">나의 별자리에 맞는 특별한 아이템을 만나보세요</div>
    <a id="result-coupang-btn" href="#" target="_blank" class="coupang-btn">🛒 쿠팡에서 보기</a>
    <p class="coupang-fine-print">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
  </div>

</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
